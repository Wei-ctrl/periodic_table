<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>原子序練習</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #000000;
    --text-dim: #919191;
    --text-faint: #bababa;
    --line: #d4d4d4;
    --line-strong: #000000;
    --metal: #e4e7ef;
    --metalloid: #d9ecd6;
    --nonmetal: #fdf0bd;
    --cls-element: #c9d6ff;
    --cls-compound: #ffe3a3;
    --cls-solution: #bfe6c4;
    --cls-mixture: #f6c6c6;
    --fcat-oxide: #ffd9b3;
    --fcat-hydride: #c9e4ff;
    --fcat-acid: #ffb3b3;
    --fcat-base: #c8f2c8;
    --fcat-salt: #f0d9ff;
    --fcat-organic: #fff2b3;
    --vcat-cation: #ffd6d6;
    --vcat-anion: #d6e8ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .app { width: 100%; max-width: 380px; }
  .app.wide { max-width: 980px; }

  .screen { display: none; }
  .screen.active { display: block; }

  .eyebrow {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 18px;
    text-align: center;
  }

  /* ---- back button ---- */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    padding: 4px 0;
    -webkit-tap-highlight-color: transparent;
  }
  .back-btn svg { width: 15px; height: 15px; }

  .sub-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .sub-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .sub-header > :first-child, .sub-header > :last-child { flex: 0 0 64px; }
  .sub-header > :last-child { display: flex; justify-content: flex-end; }

  .lang-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-faint);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .lang-btn span.on { color: var(--text); }
  .lang-btn .sep { color: var(--line); font-weight: 400; }
  .lang-btn:active { border-color: var(--line-strong); }

  /* ---- mode tabs ---- */
  .mode-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .mode-tabs.hidden { display: none; }
  .mode-tab {
    flex: 1;
    padding: 11px 0;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .mode-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* ---- classify setup ---- */
  .cat-chip-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 4px; }
  .cat-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .cat-chip .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .cat-chip.off { color: var(--text-faint); border-color: var(--line); }
  .cat-chip.off .dot { opacity: 0.35; }

  /* ---- classify quiz ---- */
  .classify-name { font-size: 32px; font-weight: 600; line-height: 1.3; word-break: keep-all; }
  .classify-en { margin-top: 6px; font-size: 13px; color: var(--text-dim); }
  .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 26px; }
  .cat-btn {
    padding: 18px 10px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    transition: background 0.1s ease, color 0.1s ease, border-color 0.1s ease;
  }
  .cat-btn:active { border-color: var(--line-strong); }
  .cat-btn.correct { background: var(--text); color: var(--bg); border-color: var(--text); }
  .cat-btn.wrong { border-color: var(--line-strong); opacity: 0.55; text-decoration: line-through; }
  .btn-next.btn-next-wide { flex: 1; gap: 8px; }
  .btn-next-wide svg { width: 18px; height: 18px; }

  /* ---- formula quiz ---- */
  .formula-name { font-size: 32px; font-weight: 600; word-break: break-word; }
  .formula-input {
    width: 100%;
    font-size: 24px;
    letter-spacing: 0.03em;
    text-align: center;
  }
  .sym-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-top: 16px;
  }
  .num-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 6px;
  }
  .sym-btn {
    padding: 10px 0;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    transition: background 0.08s ease, color 0.08s ease;
  }
  .sym-btn:active { background: var(--line-strong); color: var(--bg); }
  .quick-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin: 8px 0 4px;
  }
  .quick-btn {
    flex: 1;
    padding: 8px 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .quick-btn:active { background: var(--line-strong); color: var(--bg); }

  /* ---- valence (ion charge) quiz ---- */
  .charge-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 20px;
  }
  .charge-grid .sym-btn { padding: 14px 0; font-size: 20px; font-weight: 700; }

  /* ---- periodic table picker ---- */
  .pt-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .pt-top .title { font-size: 17px; font-weight: 700; }
  .pt-top .hint { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .pt-tools { display: flex; gap: 6px; flex-shrink: 0; }
  .tool-btn {
    padding: 7px 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .tool-btn:active { background: var(--line-strong); color: var(--bg); }

  .pt-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 6px;
    margin: 0 -20px;
    padding-left: 20px;
    padding-right: 20px;
  }
  .pt-grid {
    display: grid;
    grid-template-columns: 34px repeat(18, 46px);
    grid-auto-rows: 50px;
    gap: 3px;
    width: max-content;
  }
  .pt-grid .spacer { height: 8px; }

  .pt-head, .pt-rowlab {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 12px;
    color: var(--text);
    border-radius: 7px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    line-height: 1.1;
  }
  .pt-head small, .pt-rowlab small {
    font-size: 9px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  .pt-head:active, .pt-rowlab:active { background: var(--line); }
  .pt-rowlab {
    position: sticky;
    left: 0;
    z-index: 2;
    background: var(--bg);
    font-size: 13px;
  }
  .pt-rowlab.series { font-size: 11px; }
  .pt-corner { position: sticky; left: 0; z-index: 2; background: var(--bg); }

  .pt-cell {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--bg);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    line-height: 1;
    padding-top: 6px;
    transition: background 0.08s ease, color 0.08s ease, border-color 0.08s ease;
  }
  .pt-cell.metal { background: var(--metal); border-color: transparent; }
  .pt-cell.metalloid { background: var(--metalloid); border-color: transparent; }
  .pt-cell.nonmetal { background: var(--nonmetal); border-color: transparent; }
  .pt-cell .z {
    position: absolute;
    top: 3px;
    left: 5px;
    font-size: 9px;
    font-weight: 500;
    color: var(--text-dim);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  }
  .pt-cell .nm { font-size: 16px; font-weight: 600; }
  .pt-cell .sy { font-size: 9.5px; font-weight: 500; color: var(--text-dim); margin-top: 3px; }
  .pt-cell.on { background: var(--line-strong); border-color: var(--line-strong); color: var(--bg); }
  .pt-cell.on .z, .pt-cell.on .sy { color: rgba(255,255,255,0.65); }

  .pt-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 16px;
  }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-dim); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .legend .m { background: var(--metal); }
  .legend .md { background: var(--metalloid); }
  .legend .nm { background: var(--nonmetal); }

  .btn {
    padding: 15px 0;
    border-radius: 12px;
    border: 1px solid var(--line-strong);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s ease;
  }
  .btn-primary { width: 100%; background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn-primary:active { opacity: 0.75; }
  .btn-primary:disabled { opacity: 0.25; cursor: default; }
  .pt-foot .btn-primary { width: auto; min-width: 200px; padding-left: 24px; padding-right: 24px; }
  .pt-foot .btn-primary b { font-weight: 700; }

  @media (max-width: 600px) {
    .pt-foot { flex-direction: column; align-items: stretch; }
    .pt-foot .btn-primary { width: 100%; }
    .legend { justify-content: center; }
  }

  /* ---- quiz screen ---- */
  .card {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 48px 28px 36px;
    text-align: center;
  }

  .name-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-height: 68px;
  }
  .name-display {
    font-size: 54px;
    font-weight: 500;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    justify-content: center;
    word-break: keep-all;
  }
  .speak-btn {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--text);
    cursor: pointer;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.08s ease, color 0.08s ease;
  }
  .speak-btn svg { width: 20px; height: 20px; }
  .speak-btn:active,
  .speak-btn.speaking { background: var(--line-strong); color: var(--bg); }
  .speak-btn[hidden] { display: none; }

  .reveal {
    margin-top: 14px;
    height: 20px;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
    font-size: 15px;
    color: var(--text);
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .reveal.show { opacity: 1; transform: translateY(0); }

  .answer-input {
    width: 140px;
    margin: 18px auto 26px;
    padding: 10px 0;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--line);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
    font-size: 34px;
    font-weight: 500;
    text-align: center;
    color: var(--text);
    transition: border-color 0.2s ease;
  }
  .answer-input:focus { outline: none; border-color: var(--line-strong); }
  .answer-input.correct { border-color: var(--line-strong); }
  .answer-input.wrong { border-color: var(--line-strong); animation: shake 0.3s ease; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    margin-top: 6px;
  }
  .key {
    padding: 16px 0;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 19px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.08s ease, color 0.08s ease;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .key:active { background: var(--line-strong); color: var(--bg); }
  .key svg { width: 19px; height: 19px; }

  .actions { display: flex; gap: 9px; margin-top: 18px; }
  .btn-submit {
    flex: 1;
    background: var(--text);
    color: var(--bg);
    border: 1px solid var(--text);
  }
  .btn-submit:active { opacity: 0.75; }
  .btn-submit.wrong-state {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line-strong);
  }
  .btn-next {
    flex: 0 0 56px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-next svg { width: 20px; height: 20px; }

  .stats {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-top: 24px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .stats b { color: var(--text); font-weight: 600; }

  @media (max-width: 360px) {
    .name-display { font-size: 46px; }
    .card { padding: 40px 20px 30px; }
  }
</style>
</head>
<body>
<div class="app wide">

  <div class="mode-tabs" id="modeTabs">
    <button class="mode-tab active" data-target="screenTable">原子序</button>
    <button class="mode-tab" data-target="screenClassifySetup">物質分類</button>
    <button class="mode-tab" data-target="screenValenceSetup">化合價</button>
    <button class="mode-tab" data-target="screenFormulaSetup">化學式</button>
  </div>

  <!-- Screen A: periodic table picker -->
  <div class="screen active" id="screenTable">
    <div class="pt-top">
      <div>
        <div class="title">元素週期表</div>
        <div class="hint">點選元素、族（1A–8A）或週期（1–7）來選擇練習範圍</div>
      </div>
      <div class="pt-tools">
        <button class="tool-btn" id="selectAllBtn">全選</button>
        <button class="tool-btn" id="clearBtn">清除</button>
      </div>
    </div>
    <div class="pt-scroll">
      <div class="pt-grid" id="ptGrid"></div>
    </div>
    <div class="pt-foot">
      <div class="legend">
        <span><i class="m"></i>金屬</span>
        <span><i class="md"></i>類金屬</span>
        <span><i class="nm"></i>非金屬</span>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>開始練習</button>
    </div>
  </div>

  <!-- Screen A2: classification practice setup -->
  <div class="screen" id="screenClassifySetup">
    <div class="pt-top">
      <div>
        <div class="title">物質分類練習</div>
        <div class="hint">判斷每個物質屬於元素、化合物、溶液，還是其他混合物</div>
      </div>
    </div>
    <div class="cat-chip-row" id="catChipRow"></div>
    <div class="pt-foot">
      <span></span>
      <button class="btn btn-primary" id="classifyStartBtn">開始練習</button>
    </div>
  </div>

  <!-- Screen A3: valence (ion charge) practice setup -->
  <div class="screen" id="screenValenceSetup">
    <div class="pt-top">
      <div>
        <div class="title">化合價練習</div>
        <div class="hint">寫化學式前，先熟記常見離子的電荷 — 例如氫是 +1</div>
      </div>
    </div>
    <div class="cat-chip-row" id="vCatChipRow"></div>
    <div class="pt-foot">
      <span></span>
      <button class="btn btn-primary" id="valenceStartBtn">開始練習</button>
    </div>
  </div>

  <!-- Screen A4: formula practice setup -->
  <div class="screen" id="screenFormulaSetup">
    <div class="pt-top">
      <div>
        <div class="title">化學式練習</div>
        <div class="hint">看中文名稱，寫出正確的化學式</div>
      </div>
    </div>
    <div class="cat-chip-row" id="fCatChipRow"></div>
    <div class="pt-foot">
      <span></span>
      <button class="btn btn-primary" id="formulaStartBtn">開始練習</button>
    </div>
  </div>

  <!-- Screen B: quiz -->
  <div class="screen" id="screenQuiz">
    <div class="sub-header">
      <button class="back-btn" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        返回
      </button>
      <span class="sub-title" id="quizLabel"></span>
      <span>
        <button class="lang-btn" id="langBtn" aria-label="切換中文 / 英文符號" title="切換中文 / 英文符號">
          <span id="langZh" class="on">中</span><span class="sep">/</span><span id="langEn">EN</span>
        </button>
      </span>
    </div>
    <div class="card">
      <div class="name-row">
        <div class="name-display" id="nameDisplay">—</div>
        <button class="speak-btn" id="speakBtn" aria-label="發音" title="發音">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
      </div>
      <div class="reveal" id="reveal"></div>
      <input class="answer-input" id="answerInput" type="text" inputmode="none" readonly autocomplete="off" placeholder="?" />

      <div class="keypad" id="keypad">
        <button class="key" data-num="1">1</button>
        <button class="key" data-num="2">2</button>
        <button class="key" data-num="3">3</button>
        <button class="key" data-num="4">4</button>
        <button class="key" data-num="5">5</button>
        <button class="key" data-num="6">6</button>
        <button class="key" data-num="7">7</button>
        <button class="key" data-num="8">8</button>
        <button class="key" data-num="9">9</button>
        <button class="key" id="resetKey" aria-label="重來">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>

  function computePeriod(z) {
    if (z <= 2) return 1;
    if (z <= 10) return 2;
    if (z <= 18) return 3;
    if (z <= 36) return 4;
    if (z <= 54) return 5;
    if (z <= 86) return 6;
    return 7;
  }

  function buildTable() {
    const frag = document.createDocumentFragment();
    const el = (cls, row, col, span) => {
      const d = document.createElement('div');
      d.className = cls;
      d.style.gridRow = row;
      d.style.gridColumn = span ? (col + ' / span ' + span) : col;
      return d;
    };

    frag.appendChild(el('pt-corner', 1, 1));
    let col = 2;
    for (const [label, groups] of GROUP_HEADERS) {
      const h = el('pt-head', 1, col, groups.length);
      h.dataset.groups = groups.join(',');
      h.innerHTML = '<small>' + groups.join(' ') + '</small>' + label;
      frag.appendChild(h);
      col += groups.length;
    }

    for (let p = 1; p <= 7; p++) {
      const r = el('pt-rowlab', p + 1, 1);
      r.dataset.period = p;
      r.innerHTML = '<small>週期</small>' + p;
      frag.appendChild(r);
    }
    const sp = el('spacer', 9, 1, 19);
    frag.appendChild(sp);
    const la = el('pt-rowlab series', 10, 1);
    la.dataset.series = 'La';
    la.textContent = '鑭系';
    frag.appendChild(la);
    const ac = el('pt-rowlab series', 11, 1);
    ac.dataset.series = 'Ac';
    ac.textContent = '錒系';
    frag.appendChild(ac);

    for (const e of ELEMENTS) {
      const [name, z, g, sym] = e;
      let row, column;
      if (g === 'La') { row = 10; column = z - 58 + 5; }
      else if (g === 'Ac') { row = 11; column = z - 90 + 5; }
      else { row = computePeriod(z) + 1; column = g + 1; }
      const cat = NONMETALS.has(z) ? 'nonmetal' : METALLOIDS.has(z) ? 'metalloid' : 'metal';
      const c = el('pt-cell ' + cat, row, column);
      c.dataset.z = z;
      c.innerHTML = '<span class="z">' + z + '</span><span class="nm">' + name + '</span><span class="sy">' + sym + '</span>';
      frag.appendChild(c);
    }
    ptGrid.appendChild(frag);
  }

  function renderSelection() {
    ptGrid.querySelectorAll('.pt-cell').forEach(c => c.classList.toggle('on', selected.has(+c.dataset.z)));
    const n = selected.size;
    startBtn.disabled = n === 0;
    startBtn.innerHTML = n === 0 ? '開始練習' : '開始練習 · <b>' + n + '</b> 個元素';
    try { localStorage.setItem('sel', JSON.stringify([...selected])); } catch (_) {}
  }

  function toggleSet(zs) {
    const all = zs.every(z => selected.has(z));
    zs.forEach(z => all ? selected.delete(z) : selected.add(z));
    renderSelection();
  }

  ptGrid.addEventListener('click', (e) => {
    const cell = e.target.closest('.pt-cell');
    if (cell) { toggleSet([+cell.dataset.z]); return; }
    const head = e.target.closest('.pt-head');
    if (head) {
      const groups = head.dataset.groups.split(',').map(Number);
      toggleSet(ELEMENTS.filter(el => groups.includes(el[2])).map(el => el[1]));
      return;

  });

  document.getElementById('formulaClear').addEventListener('click', resetFormulaCurrent);
  submitBtnF.addEventListener('click', submitFormula);
  nextBtnF.addEventListener('click', nextFormulaQuestion);
  speakBtnF.addEventListener('click', speakFormulaName);

  formulaInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (formulaAnswered) nextFormulaQuestion();
    else submitFormula();
  });

  valenceInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    if (valenceAnswered) nextValenceQuestion();
    else submitValence();
  });

  document.getElementById('backBtnF').addEventListener('click', () => {
    if (formulaAdvanceTimer) { clearTimeout(formulaAdvanceTimer); formulaAdvanceTimer = null; }
    if (synth) synth.cancel();
    showScreen('screenFormulaSetup');
  });

  document.addEventListener('keydown', (e) => {
    const quizActive = document.getElementById('screenQuiz').classList.contains('active');
    const classifyActive = document.getElementById('screenClassifyQuiz').classList.contains('active');
    const formulaActive = document.getElementById('screenFormulaQuiz').classList.contains('active');
    const valenceActive = document.getElementById('screenValenceQuiz').classList.contains('active');
    if (formulaActive || valenceActive) return;
    if (!quizActive && !classifyActive) return;

    if (classifyActive) {
      if (classifyAnswered) {
        if (e.key === 'Enter') classifyNextQuestion();
        return;
      }
      if (e.key >= '1' && e.key <= '4') {
        classifySubmit(CAT_ORDER[+e.key - 1]);
      }
      return;
    }

    if (answered) {
      if (e.key === 'Enter') nextQuestion();
      return;
    }
    if (e.key >= '0' && e.key <= '9') {
      answerInput.value += e.key;
    } else if (e.key === 'Backspace') {
      answerInput.value = answerInput.value.slice(0, -1);
    } else if (e.key === 'Enter') {
      submitAnswer();
    }
  });
</script>
</body>
</html>
