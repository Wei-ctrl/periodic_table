<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#14161a">
<title>原子序練習</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #000000;
    --text-dim: #919191;
    --text-faint: #bababa;
    --line: #d4d4d4;
    --line-strong: #000000;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .app { width: 100%; max-width: 380px; }

  .screen { display: none; }
  .screen.active { display: block; }

  .eyebrow {
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 18px;
    text-align: center;
  }

  /* ---- mode select cards ---- */
  .mode-card {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 12px;
    cursor: pointer;
    text-align: left;
    transition: border-color 0.12s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .mode-card:active { border-color: var(--line-strong); }
  .mode-card h3 {
    margin: 0 0 4px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .mode-card p { margin: 0; font-size: 13px; color: var(--text-dim); }
  .infinity { font-size: 16px; }

  /* ---- back button ---- */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    padding: 4px 0;
    -webkit-tap-highlight-color: transparent;
  }
  .back-btn svg { width: 15px; height: 15px; }

  .sub-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .sub-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .sub-header > :first-child, .sub-header > :last-child { flex: 0 0 64px; }
  .sub-header > :last-child { display: flex; justify-content: flex-end; }

  .lang-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-faint);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .lang-btn span.on { color: var(--text); }
  .lang-btn .sep { color: var(--line); font-weight: 400; }
  .lang-btn:active { border-color: var(--line-strong); }

  /* ---- group grid ---- */
  .group-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .group-btn {
    aspect-ratio: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    transition: background 0.08s ease, color 0.08s ease;
  }
  .group-btn:active { background: var(--line-strong); color: var(--bg); }
  .group-btn.wide {
    grid-column: span 2;
    aspect-ratio: auto;
    padding: 13px 0;
    font-size: 13px;
  }

  /* ---- period list ---- */
  .period-list { display: flex; flex-direction: column; gap: 8px; }
  .period-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 18px;
    cursor: pointer;
    color: var(--text);
    font-size: 15px;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.08s ease, color 0.08s ease;
  }
  .period-btn:active { background: var(--line-strong); color: var(--bg); }
  .period-btn:active .count { color: var(--bg); }
  .period-btn .count { color: var(--text-dim); font-size: 12px; }

  /* ---- range picker ---- */
  .range-row {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 14px;
    margin: 30px 0 34px;
  }
  .range-field { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .range-field label { font-size: 12px; color: var(--text-dim); }
  .range-input {
    width: 84px;
    padding: 12px 0;
    text-align: center;
    font-size: 22px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  }
  .range-input:focus { outline: none; border-color: var(--line-strong); }
  .range-sep { color: var(--text-faint); font-size: 20px; padding-bottom: 12px; }

  .btn {
    padding: 15px 0;
    border-radius: 12px;
    border: 1px solid var(--line-strong);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s ease;
  }
  .btn-primary { width: 100%; background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn-primary:active { opacity: 0.75; }

  /* ---- quiz screen ---- */
  .card {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 48px 28px 36px;
    text-align: center;
  }

  .name-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    min-height: 68px;
  }
  .name-display {
    font-size: 54px;
    font-weight: 500;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    justify-content: center;
    word-break: keep-all;
  }
  .speak-btn {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 50%;
    color: var(--text);
    cursor: pointer;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.08s ease, color 0.08s ease;
  }
  .speak-btn svg { width: 20px; height: 20px; }
  .speak-btn:active,
  .speak-btn.speaking { background: var(--line-strong); color: var(--bg); }
  .speak-btn[hidden] { display: none; }

  .reveal {
    margin-top: 14px;
    height: 20px;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
    font-size: 15px;
    color: var(--text);
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .reveal.show { opacity: 1; transform: translateY(0); }

  .answer-input {
    margin-top: 22px;
    width: 120px;
    padding: 10px 0;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--line);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, monospace;
    font-size: 34px;
    font-weight: 500;
    text-align: center;
    color: var(--text);
    transition: border-color 0.2s ease;
  }
  .answer-input:focus { outline: none; border-color: var(--line-strong); }
  .answer-input.correct { border-color: var(--line-strong); }
  .answer-input.wrong { border-color: var(--line-strong); animation: shake 0.3s ease; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    margin-top: 26px;
  }
  .key {
    padding: 16px 0;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 19px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.08s ease, color 0.08s ease;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  .key:active { background: var(--line-strong); color: var(--bg); }
  .key svg { width: 19px; height: 19px; }

  .actions { display: flex; gap: 9px; margin-top: 18px; }
  .btn-submit {
    flex: 1;
    background: var(--text);
    color: var(--bg);
    border: 1px solid var(--text);
  }
  .btn-submit:active { opacity: 0.75; }
  .btn-submit.wrong-state {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line-strong);
  }
  .btn-next {
    flex: 0 0 56px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-next svg { width: 18px; height: 18px; }

  .stats {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin-top: 24px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .stats b { color: var(--text); font-weight: 600; }

  @media (max-width: 360px) {
    .name-display { font-size: 46px; }
    .card { padding: 40px 20px 30px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- Screen A: mode select -->
  <div class="screen active" id="screenMode">
    <div class="eyebrow">選擇練習範圍</div>
    <div class="mode-card" id="modeGroupCard">
      <h3>依族練習</h3>
      <p>選擇一個族，只練習同族元素</p>
    </div>
    <div class="mode-card" id="modePeriodCard">
      <h3>依週期練習</h3>
      <p>選擇一個週期，只練習同週期元素</p>
    </div>
    <div class="mode-card" id="modeRangeCard">
      <h3>自訂範圍</h3>
      <p>自訂原子序區間，例如 5 到 30</p>
    </div>
    <div class="mode-card" id="modeZenCard">
      <h3>Zen 模式 <span class="infinity">∞</span></h3>
      <p>全部 118 個元素，沒有範圍限制</p>
    </div>
  </div>

  <!-- Screen B1: group picker -->
  <div class="screen" id="screenGroupPick">
    <div class="sub-header">
      <button class="back-btn back-to-mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        返回
      </button>
      <span class="sub-title">選擇族</span>
      <span></span>
    </div>
    <div class="group-grid" id="groupGrid">
      <button class="group-btn" data-group="1A">1A</button>
      <button class="group-btn" data-group="2A">2A</button>
      <button class="group-btn" data-group="3B">3B</button>
      <button class="group-btn" data-group="4B">4B</button>
      <button class="group-btn" data-group="5B">5B</button>
      <button class="group-btn" data-group="6B">6B</button>
      <button class="group-btn" data-group="7B">7B</button>
      <button class="group-btn" data-group="8B">8B</button>
      <button class="group-btn" data-group="1B">1B</button>
      <button class="group-btn" data-group="2B">2B</button>
      <button class="group-btn" data-group="3A">3A</button>
      <button class="group-btn" data-group="4A">4A</button>
      <button class="group-btn" data-group="5A">5A</button>
      <button class="group-btn" data-group="6A">6A</button>
      <button class="group-btn" data-group="7A">7A</button>
      <button class="group-btn" data-group="8A">8A</button>
      <button class="group-btn wide" data-group="La">鑭系</button>
      <button class="group-btn wide" data-group="Ac">錒系</button>
    </div>
  </div>

  <!-- Screen B2: period picker -->
  <div class="screen" id="screenPeriodPick">
    <div class="sub-header">
      <button class="back-btn back-to-mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        返回
      </button>
      <span class="sub-title">選擇週期</span>
      <span></span>
    </div>
    <div class="period-list" id="periodList">
      <button class="period-btn" data-period="1">第 1 週期 <span class="count">2 個元素</span></button>
      <button class="period-btn" data-period="2">第 2 週期 <span class="count">8 個元素</span></button>
      <button class="period-btn" data-period="3">第 3 週期 <span class="count">8 個元素</span></button>
      <button class="period-btn" data-period="4">第 4 週期 <span class="count">18 個元素</span></button>
      <button class="period-btn" data-period="5">第 5 週期 <span class="count">18 個元素</span></button>
      <button class="period-btn" data-period="6">第 6 週期 <span class="count">32 個元素</span></button>
      <button class="period-btn" data-period="7">第 7 週期 <span class="count">32 個元素</span></button>
    </div>
  </div>

  <!-- Screen B3: range picker -->
  <div class="screen" id="screenRangePick">
    <div class="sub-header">
      <button class="back-btn back-to-mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        返回
      </button>
      <span class="sub-title">自訂範圍</span>
      <span></span>
    </div>
    <div class="range-row">
      <div class="range-field">
        <label>從</label>
        <input class="range-input" id="rangeFrom" type="number" inputmode="numeric" placeholder="1" min="1" max="118">
      </div>
      <div class="range-sep">–</div>
      <div class="range-field">
        <label>到</label>
        <input class="range-input" id="rangeTo" type="number" inputmode="numeric" placeholder="118" min="1" max="118">
      </div>
    </div>
    <button class="btn btn-primary" id="rangeStartBtn">開始練習</button>
  </div>

  <!-- Screen C: quiz -->
  <div class="screen" id="screenQuiz">
    <div class="sub-header">
      <button class="back-btn back-to-mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        返回
      </button>
      <span class="sub-title" id="quizLabel"></span>
      <span>
        <button class="lang-btn" id="langBtn" aria-label="切換中文 / 英文符號" title="切換中文 / 英文符號">
          <span id="langZh" class="on">中</span><span class="sep">/</span><span id="langEn">EN</span>
        </button>
      </span>
    </div>
    <div class="card">
      <div class="name-row">
        <div class="name-display" id="nameDisplay">—</div>
        <button class="speak-btn" id="speakBtn" aria-label="發音" title="發音">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
      </div>
      <div class="reveal" id="reveal"></div>
      <input class="answer-input" id="answerInput" type="text" inputmode="none" readonly autocomplete="off" placeholder="?" />

      <div class="keypad" id="keypad">
        <button class="key" data-num="1">1</button>
        <button class="key" data-num="2">2</button>
        <button class="key" data-num="3">3</button>
        <button class="key" data-num="4">4</button>
        <button class="key" data-num="5">5</button>
        <button class="key" data-num="6">6</button>
        <button class="key" data-num="7">7</button>
        <button class="key" data-num="8">8</button>
        <button class="key" data-num="9">9</button>
        <button class="key" id="resetKey" aria-label="重來">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
        <button class="key" data-num="0">0</button>
        <button class="key" id="deleteKey" aria-label="刪除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
        </button>
      </div>

      <div class="actions">
        <button class="btn btn-submit" id="submitBtn">送出</button>
        <button class="btn btn-next" id="nextBtn" aria-label="下一個">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </div>

    <div class="stats">
      <div>已作答 <b id="statAnswered">0</b></div>
      <div>答對 <b id="statCorrect">0</b></div>
      <div>正確率 <b id="statAccuracy">—</b></div>
    </div>
  </div>

</div>

<script>

    ['銫',55,1,'Cs','Cesium'],['鋇',56,2,'Ba','Barium'],
    ['鑭',57,3,'La','Lanthanum'],['鈰',58,'La','Ce','Cerium'],['鐠',59,'La','Pr','Praseodymium'],['釹',60,'La','Nd','Neodymium'],['鉕',61,'La','Pm','Promethium'],['釤',62,'La','Sm','Samarium'],['銪',63,'La','Eu','Europium'],['釓',64,'La','Gd','Gadolinium'],['鋱',65,'La','Tb','Terbium'],['鏑',66,'La','Dy','Dysprosium'],['鈥',67,'La','Ho','Holmium'],['鉺',68,'La','Er','Erbium'],['銩',69,'La','Tm','Thulium'],['鐿',70,'La','Yb','Ytterbium'],['鎦',71,'La','Lu','Lutetium'],
    ['鉿',72,4,'Hf','Hafnium'],['鉭',73,5,'Ta','Tantalum'],['鎢',74,6,'W','Tungsten'],['錸',75,7,'Re','Rhenium'],['鋨',76,8,'Os','Osmium'],['銥',77,9,'Ir','Iridium'],['鉑',78,10,'Pt','Platinum'],['金',79,11,'Au','Gold'],['汞',80,12,'Hg','Mercury'],['鉈',81,13,'Tl','Thallium'],['鉛',82,14,'Pb','Lead'],['鉍',83,15,'Bi','Bismuth'],['釙',84,16,'Po','Polonium'],['砈',85,17,'At','Astatine'],['氡',86,18,'Rn','Radon'],
    ['鍅',87,1,'Fr','Francium'],['鐳',88,2,'Ra','Radium'],
    ['錒',89,3,'Ac','Actinium'],['釷',90,'Ac','Th','Thorium'],['鏷',91,'Ac','Pa','Protactinium'],['鈾',92,'Ac','U','Uranium'],['錼',93,'Ac','Np','Neptunium'],['鈽',94,'Ac','Pu','Plutonium'],['鋂',95,'Ac','Am','Americium'],['鋦',96,'Ac','Cm','Curium'],['鉳',97,'Ac','Bk','Berkelium'],['鉲',98,'Ac','Cf','Californium'],['鑀',99,'Ac','Es','Einsteinium'],['鐨',100,'Ac','Fm','Fermium'],['鍆',101,'Ac','Md','Mendelevium'],['鍩',102,'Ac','No','Nobelium'],['鐒',103,'Ac','Lr','Lawrencium'],
    ['鑪',104,4,'Rf','Rutherfordium'],['𨧀',105,5,'Db','Dubnium'],['𨭎',106,6,'Sg','Seaborgium'],['𨨏',107,7,'Bh','Bohrium'],['𨭆',108,8,'Hs','Hassium'],['鿏',109,9,'Mt','Meitnerium'],['鐽',110,10,'Ds','Darmstadtium'],['錀',111,11,'Rg','Roentgenium'],['鎶',112,12,'Cn','Copernicium'],['鉨',113,13,'Nh','Nihonium'],['鈇',114,14,'Fl','Flerovium'],['鏌',115,15,'Mc','Moscovium'],['鉝',116,16,'Lv','Livermorium'],['鿬',117,17,'Ts','Tennessine'],['鿫',118,18,'Og','Oganesson']
  ];

  let currentPool = ELEMENTS;
  let currentEl = null;
  let currentZ = null;
  let showEnglish = false;
  try { showEnglish = localStorage.getItem('lang') === 'en'; } catch (_) {}
  let answered = false;
  let advanceTimer = null;
  let lastIndex = -1;
  const stats = { answered: 0, correct: 0 };

  const nameDisplay = document.getElementById('nameDisplay');
  const reveal = document.getElementById('reveal');
  const answerInput = document.getElementById('answerInput');
  const submitBtn = document.getElementById('submitBtn');
  const nextBtn = document.getElementById('nextBtn');
  const resetKey = document.getElementById('resetKey');
  const deleteKey = document.getElementById('deleteKey');
  const keypad = document.getElementById('keypad');
  const statAnswered = document.getElementById('statAnswered');
  const statCorrect = document.getElementById('statCorrect');
  const statAccuracy = document.getElementById('statAccuracy');
  const quizLabel = document.getElementById('quizLabel');
  const speakBtn = document.getElementById('speakBtn');
  const langBtn = document.getElementById('langBtn');
  const langZh = document.getElementById('langZh');
  const langEn = document.getElementById('langEn');

  // ---- 中文 / English symbol toggle ----
  function renderName() {
    if (!currentEl) return;
    nameDisplay.textContent = showEnglish ? currentEl[3] : currentEl[0];
  }

  function renderLangBtn() {
    langZh.classList.toggle('on', !showEnglish);
    langEn.classList.toggle('on', showEnglish);
  }

  function toggleLang() {
    showEnglish = !showEnglish;
    try { localStorage.setItem('lang', showEnglish ? 'en' : 'zh'); } catch (_) {}
    renderLangBtn();
    renderName();
  }
  renderLangBtn();

  // ---- pronunciation (Web Speech API) ----
  const synth = window.speechSynthesis;
  if (!synth) speakBtn.hidden = true;

  function pickVoice(lang) {
    const voices = synth.getVoices();
    if (lang === 'en') {
      return voices.find(v => /^en[-_]US/i.test(v.lang))
          || voices.find(v => /^en/i.test(v.lang))
          || null;
    }
    return voices.find(v => /^zh[-_]TW/i.test(v.lang))
        || voices.find(v => /^zh[-_]HK/i.test(v.lang))
        || voices.find(v => /^zh/i.test(v.lang))
        || null;
  }

  function speakName() {
    if (!synth || !currentEl) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(showEnglish ? currentEl[4] : currentEl[0]);
    u.lang = showEnglish ? 'en-US' : 'zh-TW';
    u.rate = 0.85;
    const voice = pickVoice(showEnglish ? 'en' : 'zh');
    if (voice) u.voice = voice;
    u.onstart = () => speakBtn.classList.add('speaking');
    u.onend = u.onerror = () => speakBtn.classList.remove('speaking');
    synth.speak(u);
  }

  function computePeriod(z) {
    if (z <= 2) return 1;
    if (z <= 10) return 2;
    if (z <= 18) return 3;
    if (z <= 36) return 4;
    if (z <= 54) return 5;
    if (z <= 86) return 6;
    return 7;
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function pickElement() {
    let idx;
    do {
      idx = Math.floor(Math.random() * currentPool.length);
    } while (idx === lastIndex && currentPool.length > 1);
    lastIndex = idx;
    return currentPool[idx];
  }

  function clearFeedback() {
    reveal.classList.remove('show', 'wrong-color');
    reveal.textContent = '';
    answerInput.classList.remove('correct', 'wrong');
    submitBtn.classList.remove('wrong-state');
    submitBtn.textContent = '送出';
  }

  function nextQuestion() {
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
    currentEl = pickElement();
    currentZ = currentEl[1];
    renderName();
    answerInput.value = '';
    clearFeedback();
    answered = false;
    answerInput.focus();
  }

  function resetCurrent() {
    if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
    answerInput.value = '';
    clearFeedback();
    answered = false;
    answerInput.focus();
  }

  function updateStats() {
    statAnswered.textContent = stats.answered;
    statCorrect.textContent = stats.correct;
    statAccuracy.textContent = stats.answered ? Math.round(stats.correct / stats.answered * 100) + '%' : '—';
  }

  function submitAnswer() {
    if (answered) return;
    const raw = answerInput.value.trim();
    if (!raw) {
      answerInput.classList.add('wrong');
      setTimeout(() => answerInput.classList.remove('wrong'), 300);
      return;
    }

    const guess = parseInt(raw, 10);
    answered = true;
    stats.answered++;

    if (guess === currentZ) {
      stats.correct++;
      answerInput.classList.add('correct');
      reveal.textContent = '✓ 原子序 ' + currentZ;
      reveal.classList.add('show');
      submitBtn.textContent = '✓ 正確';
      advanceTimer = setTimeout(nextQuestion, 800);
    } else {
      answerInput.classList.add('wrong');
      reveal.textContent = '✗ 正確答案 ' + currentZ;
      reveal.classList.add('show', 'wrong-color');
      submitBtn.classList.add('wrong-state');
      submitBtn.textContent = '再試一次';
    }

    updateStats();
  }

  function startSession(pool, label) {
    currentPool = pool;
    quizLabel.textContent = label;
    stats.answered = 0;
    stats.correct = 0;
    updateStats();
    lastIndex = -1;
    showScreen('screenQuiz');
    nextQuestion();
  }

  // ---- mode select ----
  document.getElementById('modeGroupCard').addEventListener('click', () => showScreen('screenGroupPick'));
  document.getElementById('modePeriodCard').addEventListener('click', () => showScreen('screenPeriodPick'));
  document.getElementById('modeRangeCard').addEventListener('click', () => showScreen('screenRangePick'));
  document.getElementById('modeZenCard').addEventListener('click', () => startSession(ELEMENTS, 'Zen 模式 ∞'));

  document.querySelectorAll('.back-to-mode').forEach(btn => {
    btn.addEventListener('click', () => {
      if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }
      showScreen('screenMode');
    });
  });

  // ---- group picker ----
  // CAS-style group label -> IUPAC group numbers (8B spans groups 8-10)
  const CAS_GROUPS = {
    '1A': [1], '2A': [2],
    '3B': [3], '4B': [4], '5B': [5], '6B': [6], '7B': [7], '8B': [8, 9, 10],
    '1B': [11], '2B': [12],
    '3A': [13], '4A': [14], '5A': [15], '6A': [16], '7A': [17], '8A': [18]
  };

  document.getElementById('groupGrid').addEventListener('click', (e) => {
    const btn = e.target.closest('.group-btn');
    if (!btn) return;
    const g = btn.dataset.group;
    // 鑭/錒 sit in group 3B but also head their own series
    const pool = g === 'La' ? ELEMENTS.filter(el => el[1] >= 57 && el[1] <= 71)
               : g === 'Ac' ? ELEMENTS.filter(el => el[1] >= 89 && el[1] <= 103)
               : ELEMENTS.filter(el => CAS_GROUPS[g].includes(el[2]));
    const label = g === 'La' ? '鑭系' : g === 'Ac' ? '錒系' : ('第 ' + g + ' 族');
    startSession(pool, label);
  });

  // ---- period picker ----
  document.getElementById('periodList').addEventListener('click', (e) => {
    const btn = e.target.closest('.period-btn');
    if (!btn) return;
    const p = parseInt(btn.dataset.period, 10);
    const pool = ELEMENTS.filter(el => computePeriod(el[1]) === p);
    startSession(pool, '第 ' + p + ' 週期');
  });

  // ---- range picker ----
  document.getElementById('rangeStartBtn').addEventListener('click', () => {
    const fromField = document.getElementById('rangeFrom');
    const toField = document.getElementById('rangeTo');
    let from = parseInt(fromField.value || fromField.placeholder, 10);
    let to = parseInt(toField.value || toField.placeholder, 10);
    from = Math.max(1, Math.min(118, from));
    to = Math.max(1, Math.min(118, to));
    if (from > to) { const t = from; from = to; to = t; }
    const pool = ELEMENTS.filter(el => el[1] >= from && el[1] <= to);
    startSession(pool, '範圍 ' + from + '–' + to);
  });

  // ---- quiz interactions ----
  keypad.addEventListener('click', (e) => {
    const key = e.target.closest('.key');
    if (!key || answered) return;
    if (key.dataset.num !== undefined) {
      answerInput.value += key.dataset.num;
    }
  });

  deleteKey.addEventListener('click', () => {
    if (answered) return;
    answerInput.value = answerInput.value.slice(0, -1);
  });

  resetKey.addEventListener('click', resetCurrent);
  submitBtn.addEventListener('click', submitAnswer);
  nextBtn.addEventListener('click', nextQuestion);
  speakBtn.addEventListener('click', speakName);
  langBtn.addEventListener('click', toggleLang);

  document.addEventListener('keydown', (e) => {
    const quizActive = document.getElementById('screenQuiz').classList.contains('active');
    if (!quizActive) return;
    if (answered) {
      if (e.key === 'Enter') nextQuestion();
      return;
    }
    if (e.key >= '0' && e.key <= '9') {
      answerInput.value += e.key;
    } else if (e.key === 'Backspace') {
      answerInput.value = answerInput.value.slice(0, -1);
    } else if (e.key === 'Enter') {
      submitAnswer();
    }
  });
</script>
</body>
</html>
